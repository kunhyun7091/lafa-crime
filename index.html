<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111318">
<title>크라임씬 현장 증거 수사본부</title>
<style>
  :root {
    --bg-dark: #0f1115; --panel-dark: #181b22; --police-yellow: #f5c518; --accent-red: #e63946;
    --text-light: #f1f5f9; --text-muted: #94a3b8;
    --paper: #f3ecdc; --paper-ink: #2b2620; --paper-line: #d9cfb8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg-dark); color: var(--text-light);
    height: 100dvh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
  }
  button { font: inherit; }
  .police-tape {
    background: repeating-linear-gradient(-45deg, #d4a017, #d4a017 14px, #1a1a1a 14px, #1a1a1a 28px);
    height: 22px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
  }
  .police-tape span { background: rgba(212,160,23,.92); color: #000; font-weight: 900; font-size: 11px; letter-spacing: 1.5px; padding: 1px 10px; white-space: nowrap; }
  header {
    background: var(--panel-dark); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; border-bottom: 1px solid #2a2f3a; flex-shrink: 0;
  }
  .header-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .badge-live { background: var(--accent-red); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
  .header-title h1 { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .progress-pill { background: #252a34; border: 1px solid #384152; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--police-yellow); }
  .icon-btn { background: #252a34; border: 1px solid #384152; color: var(--text-light); padding: 5px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .icon-btn.active { background: var(--police-yellow); color: #000; border-color: var(--police-yellow); }

  .toolbar-banner {
    background: #2b1d1d; border-bottom: 1px solid #5c2b2b; color: #fca5a5; font-size: 12px; padding: 8px 12px;
    display: none; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
  }
  .toolbar-banner.show { display: flex; }
  .toolbar-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .tool-btn { background: var(--police-yellow); color: #000; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .tool-btn.blue { background: #38bdf8; }
  .tool-btn.gray { background: #cbd5e1; }
  .tool-btn.red { background: #fca5a5; }

  .stage-wrapper {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center; padding: 10px; overflow: hidden;
    background: radial-gradient(circle at center, #1e232d 0%, #0b0d11 100%); min-height: 0;
  }
  .scene-canvas {
    position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 12px 35px rgba(0,0,0,.7);
    border: 2px solid #2e3440; background-color: #1c1f26; background-size: cover; background-position: center; background-repeat: no-repeat;
  }
  .zone-label {
    position: absolute; top: 10px; left: 10px; background: rgba(15,17,21,.82); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.15); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; z-index: 5; pointer-events: none;
  }
  .hotspot {
    position: absolute; left: 0; top: 0; background: linear-gradient(180deg, #fff 0%, #e5e7eb 100%); color: #111827;
    font-weight: 800; font-size: var(--hs-fs, 12px); padding: .5em 1em; border-radius: 999px; border: 2px solid #fff;
    box-shadow: 0 4px 12px rgba(0,0,0,.55), inset 0 -2px 4px rgba(0,0,0,.15); cursor: pointer; white-space: nowrap; z-index: 10;
    display: flex; align-items: center; gap: .35em; touch-action: none; line-height: 1.15;
  }
  .hotspot.dragging { transition: none; z-index: 12; }
  .hotspot::after { content: ""; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-width: 6px 6px 0; border-style: solid; border-color: #e5e7eb transparent; }
  .hotspot.moved::after { display: none; }
  .hotspot.visited { background: linear-gradient(180deg, #fef08a 0%, #facc15 100%); border-color: #fef08a; color: #000; }
  .hotspot.visited::after { border-color: #facc15 transparent; }
  .edit-mode .hotspot { border: 2px dashed var(--accent-red); cursor: move; }
  .hs-dot {
    position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; border: 2px solid #f5c518;
    box-shadow: 0 0 0 0 rgba(245,197,24,.7); z-index: 9; pointer-events: none; animation: dotPulse 1.8s ease-out infinite; display: none;
  }
  .hs-dot.show { display: block; }
  .hs-lines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 9; pointer-events: none; overflow: visible; }
  .hs-lines line { stroke: rgba(255,255,255,.92); stroke-width: 2; filter: drop-shadow(0 1px 2px rgba(0,0,0,.8)); }
  @keyframes dotPulse { 0% { box-shadow: 0 0 0 0 rgba(245,197,24,.75); } 70% { box-shadow: 0 0 0 9px rgba(245,197,24,0); } 100% { box-shadow: 0 0 0 0 rgba(245,197,24,0); } }

  .bottom-nav {
    background: var(--panel-dark); border-top: 1px solid #2a2f3a; display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); gap: 8px; flex-shrink: 0;
  }
  .tab-btn {
    background: #232730; border: 1px solid #323846; color: var(--text-muted); padding: 10px 4px; border-radius: 10px; font-size: 12px;
    font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
  }
  .tab-btn .tab-icon { font-size: 16px; }
  .tab-btn.active { background: #2e3545; color: var(--police-yellow); border-color: var(--police-yellow); box-shadow: 0 0 12px rgba(245,197,24,.2); }

  /* modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.78); backdrop-filter: blur(5px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 14px; }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: #1a1e26; border: 1px solid #384152; border-radius: 16px; width: 100%; max-width: 460px; max-height: 90dvh;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.85); animation: popUp .2s ease-out;
  }
  @keyframes popUp { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-header { padding: 12px 14px; background: #232834; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #32394a; }
  .modal-header h2 { flex: 1; font-size: 16px; font-weight: 800; color: var(--police-yellow); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .round-btn { background: #32394a; border: none; color: #fff; min-width: 30px; height: 30px; border-radius: 15px; font-weight: 800; cursor: pointer; padding: 0 10px; font-size: 12px; }
  .modal-scroll { overflow-y: auto; }
  .modal-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .clue-image-box { width: 100%; border-radius: 10px; overflow: hidden; background: #0f1115; border: 1px solid #2d3340; }
  .clue-image-box img { width: 100%; height: auto; display: block; }
  .clue-image-empty { padding: 22px; text-align: center; color: var(--text-muted); font-size: 12px; line-height: 1.6; }

  .hint-card {
    background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 26px 16px 16px; position: relative;
    box-shadow: 0 6px 16px rgba(0,0,0,.45); background-image: repeating-linear-gradient(180deg, transparent 0 27px, var(--paper-line) 27px 28px);
  }
  .hint-card::before { /* pin */
    content: ""; position: absolute; top: 7px; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff6b6b, #b91c1c); box-shadow: 0 2px 3px rgba(0,0,0,.4);
  }
  .hint-label { font-size: 12px; font-weight: 900; letter-spacing: .5px; color: #7a1f1f; margin-bottom: 6px; text-align: center; }
  .hint-text { font-size: 14.5px; line-height: 1.75; white-space: pre-line; word-break: keep-all; }
  .bonus-cover {
    width: 100%; border: 2px dashed #b49a6a; background: repeating-linear-gradient(-45deg, #e8dcc0 0 12px, #e1d3b3 12px 24px);
    color: #5b4a2c; border-radius: 6px; padding: 22px 10px; font-weight: 800; font-size: 14px; cursor: pointer;
  }
  .bonus-cover small { display: block; font-weight: 600; font-size: 11px; margin-top: 4px; color: #7c6a48; }
  .reveal { animation: reveal .3s ease-out; }
  @keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .choice-btn, .link-btn {
    background: #fffaf0; color: #2b2620; border: 1px solid #c9b88f; border-radius: 8px; padding: 11px 10px; font-weight: 800;
    font-size: 13px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 0 #c9b88f;
  }
  .choice-btn:active, .link-btn:active { transform: translateY(1px); box-shadow: none; }
  .choice-btn.seen::after, .link-btn.seen::after { content: "✔"; margin-left: auto; color: #15803d; }
  .links-wrap { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .back-scene { background: #2a303c; border: 1px solid #3c4557; color: #e2e8f0; border-radius: 10px; padding: 11px; font-weight: 800; font-size: 13px; cursor: pointer; }

  /* admin */
  .admin-panel { background: #14171f; border-top: 1px solid #32394a; padding: 14px; display: none; flex-direction: column; gap: 10px; }
  .admin-panel.show { display: flex; }
  .admin-panel h3 { font-size: 13px; color: var(--police-yellow); }
  .admin-panel label.f { font-size: 12px; color: #cbd5e1; font-weight: 700; display: flex; flex-direction: column; gap: 5px; }
  .admin-panel input[type=text], .admin-panel textarea, .admin-panel select {
    width: 100%; background: #0f1115; border: 1px solid #384152; border-radius: 8px; color: #fff; padding: 8px; font-size: 13px; font-family: inherit;
  }
  .admin-panel textarea { min-height: 76px; resize: vertical; line-height: 1.5; }
  .admin-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .admin-panel details { background: #0f1115; border: 1px solid #2d3340; border-radius: 8px; padding: 8px 10px; }
  .admin-panel summary { font-size: 12px; font-weight: 700; color: #cbd5e1; cursor: pointer; }
  .check-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; margin-top: 8px; }
  .check-list label { font-size: 12px; color: #e2e8f0; display: flex; gap: 5px; align-items: center; }
  .admin-note { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
  .divider { height: 1px; background: #2d3340; margin: 2px 0; }

  .badge-live, .tab-btn span { white-space: nowrap; }
  @media (max-width: 360px) {
    .badge-live { display: none; }
    .tab-btn { font-size: 11px; padding: 8px 2px; letter-spacing: -.3px; }
    .progress-pill, .icon-btn { font-size: 11px; padding: 4px 8px; }
  }
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #0f1115; border: 1px solid #384152; color: #fff;
    padding: 10px 14px; border-radius: 10px; font-size: 12px; z-index: 200; max-width: calc(100% - 30px); text-align: center; display: none;
  }
  .toast.show { display: block; }
</style>
</head>
<body>
  <div class="police-tape"><span>POLICE LINES DO NOT CROSS · CRIME SCENE INVESTIGATION · DO NOT CROSS</span></div>
  <header>
    <div class="header-title"><span class="badge-live">수사중</span><h1>크라임씬 현장 증거 힌트</h1></div>
    <div class="header-actions">
      <div class="progress-pill" id="progressText">단서 1 / 23</div>
      <button class="icon-btn" id="editModeBtn" type="button">⚙️ 세팅</button>
    </div>
  </header>
  <div class="toolbar-banner" id="editToolbar">
    <div><strong>세팅 모드</strong> · 말풍선을 끌어 위치를 옮기고, 눌러서 힌트를 편집하세요.</div>
    <div class="toolbar-actions">
      <button class="tool-btn gray" type="button" id="addHotspotBtn">＋ 말풍선 추가</button>
      <label class="tool-btn blue">🖼️ 배경 변경<input type="file" accept="image/*" hidden="" id="bgInput"></label>
      <label class="tool-btn gray">📂 기존 HTML 불러오기<input type="file" accept=".html,text/html" hidden="" id="importInput"></label>
      <button class="tool-btn gray" type="button" id="resetProgressBtn">↺ 진행 초기화</button>
      <button class="tool-btn" type="button" id="exportBtn">💾 완성본 HTML 저장</button>

  </div>

ices":[]},"hospital":{"title":"병원 검색 결과","basic":"병원 안내에는 진료 분야와 의료진 정보가 나와 있습니다. 다른 자료에서 본 이름이 있는지 확인해 보세요.","bonus":"병원에 소개된 의사의 이름을 증인 목록과 비교해 보세요. 같은 사람이 있다면 민서의 진료에 관해 질문할 수 있습니다.","img":"","links":[],"choices":[]},"pharmacy":{"title":"약국 봉투","basic":"봉투에는 약 이름이 적혀 있습니다. 이 이름으로 무엇을 알아낼 수 있을까요?","bonus":"노트북의 검색 사이트에 봉투에 적힌 약 이름을 입력해 보세요. 검색 결과에서 어떤 증상이나 치료와 관련되어 있는지 확인하세요.","img":"","links":[],"choices":[]},"map":{"title":"병원 지도","basic":"약봉투에 적힌 약국이 지도에도 표시되어 있습니다. 주변에는 어떤 병원들이 있나요?","bonus":"약 이름의 검색 결과와 지도에 표시된 병원들의 진료 분야를 비교해 보세요. 관련 있어 보이는 병원 이름을 검색 사이트에 입력해 보세요.","img":"","links":[],"choices":[]},"diary":{"title":"일기장","basic":"글이 이어지다가 중간에서 끊겨 있습니다. 페이지 가장자리에도 흔적이 남아 있습니다.","bonus":"빠진 페이지가 주변에 남아 있을 수 있습니다. 책상 아래와 쓰레기통을 살펴보세요.","img":"","links":[],"choices":[]},"locker":{"title":"민서의 사물함","basic":"사물함에는 누군가의 선물과 여러 메모가 남아 있습니다. 모두 같은 마음으로 남긴 것일까요?","bonus":"응원하는 내용과 놀리는 내용을 나누어 살펴보세요. 작성자를 알 수 있는 이름이나 서명이 있는지도 확인하세요.","img":"","links":["postit"],"choices":[]},"postit":{"title":"런닝맨 포스트잇","basic":"누군가 민서를 특정한 별명으로 부르고 있습니다. 이 별명이 처음 등장한 곳은 어디일까요?","bonus":"학급 단체 대화방에서 같은 단어를 찾아보세요. 그 말이 나오기 직전에 올라온 사진과 대화도 확인하세요.","img":"","links":[],"choices":[]},"gift":{"title":"친구의 선물","basic":"민서의 학교생활을 가까이에서 지켜본 사람이 남긴 글입니다. 보낸 사람은 누구인가요?","bonus":"편지에 적힌 이름을 증인 목록과 비교해 보세요. 민서의 최근 행동에 관해 물어볼 수 있습니다.","img":"","links":[],"choices":[]},"teacher_log":{"title":"교사 일지","basic":"교사가 관찰한 민서의 학교생활이 기록되어 있습니다. 민서와 가까이 앉아 있던 학생은 누구인가요?","bonus":"짝꿍에 관한 기록을 확인하세요. 해당 학생의 진술과 비교해 보세요.","img":"","links":[],"choices":[]},"groupchat":{"title":"학급 단체 대화방","basic":"사진 한 장이 올라온 뒤 대화의 분위기가 달라졌습니다. 누가 사진을 올렸고, 친구들은 어떻게 반응했나요?","bonus":"사진 게시자와 게시 시각을 확인하세요. 이후 민서와 게시자 사이에 따로 주고받은 대화가 있는지도 살펴보세요.","img":"","links":["dm"],"choices":[]},"dm":{"title":"민서와 지훈의 개인 대화","basic":"단체방에서 끝나지 않은 이야기가 두 사람의 대화로 이어집니다. 서로 무엇을 요구하고 있나요?","bonus":"방송이나 사진에 관한 말, 만나기로 한 장소와 시각을 찾아보세요. 사건 현장의 CCTV 기록과 연결할 수 있는지 확인하세요.","img":"","links":[],"choices":[]},"phone":{"title":"부서진 휴대전화","basic":"휴대전화가 파손된 채 발견되었습니다. 누구의 것이며, 어디에 떨어져 있나요?","bonus":"휴대전화 뒷면에 있는 라벨지를 확인해 보세요.","img":"","links":[],"choices":[]},"brick":{"title":"벽돌","basic":"벽돌의 표면에 흔적이 남아 있습니다. 주변의 다른 물건들과 어떤 차이가 있나요?","bonus":"발견 위치와 표면 상태를 기록하고, 관련 감식자료를 확인하세요. 영상 속 물건과 같은 것으로 볼 수 있는지도 비교해 보세요.","img":"","links":[],"choices":[]},"blood":{"title":"혈흔","basic":"바닥에 남은 흔적은 어디에 모여 있나요? 휴대전화와 벽돌은 그곳에서 얼마나 떨어져 있나요?","bonus":"현장 배치도에 각 위치를 표시해 보세요. CCTV에 나타나는 두 사람의 이동과 맞아떨어지는지 확인하세요.","img":"","links":[],"choices":[]},"autopsy":{"title":"부검서","basic":"겉으로 보이는 흔적과 몸 안의 손상은 같은 정보를 알려줄까요? 손상 부위와 사망 원인을 구분해 읽어보세요.","bonus":"머리의 어느 부위에 어떤 손상이 기록되어 있는지 확인하세요. 현장의 물건과 영상이 그 설명에 부합하는지 비교해 보세요.","img":"","links":[],"choices":[]},"cctv":{"title":"CCTV실","basic":"카메라마다 보이는 장소가 다릅니다. 두 사람이 처음 함께 나타나는 영상부터 찾아보세요.","bonus":"촬영 위치와 시각을 확인한 뒤, 만남·실랑이·가격 전후·현장 이탈 순서로 정리해 보세요. 화면에 보이지 않는 부분은 따로 표시하세요.","img":"","links":["cctv_after"],"choices":[]},"cctv_after":{"title":"CCTV를 확인한 후","basic":"처음에는 놓쳤지만 다른 증거를 보고 나니 다시 확인하고 싶은 장면이 있나요?","bonus":"휴대전화가 떨어지는 순간, 두 사람의 손과 몸의 위치, 벽돌을 사용하는 전후 장면을 다시 살펴보세요. 관찰한 사실과 자신의 추측을 나누어 적어보세요.","img":"","links":[],"choices":[]},"friend_letter":{"title":"친구의 편지","basic":"","bonus":"","img":"","links":[],"choices":[]}}}</script>
<script>
(() => {
  'use strict';
  const LS_KEY = 'law-impact-crimescene-v2';
  const DATA = JSON.parse(document.getElementById('game-data').textContent);
  try {
    const saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (saved && saved.nodes && (saved.updatedAt || 0) > (DATA.updatedAt || 0)) {
      DATA.zones = saved.zones; DATA.hotspots = saved.hotspots; DATA.nodes = saved.nodes; DATA.updatedAt = saved.updatedAt;
    }
  } catch (e) {}

  const $ = (s) => document.querySelector(s);
  const state = { zone: 'room', edit: false, stack: [], current: null, hotspotId: null, viewed: new Set(), revealed: new Set(), delArm: null };

  // ---------- persistence ----------
  let saveTimer = null;
  function save() {
    DATA.updatedAt = Date.now();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }
      catch (e) { toast('브라우저 임시 저장 공간이 부족합니다. [완성본 HTML 저장]으로 파일에 저장하세요.'); }
    }, 300);
  }
  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }
  const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 8);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- scene ----------
  function fitCanvas() {
    const zone = DATA.zones[state.zone];
    const stage = $('#stage'); const c = $('#sceneCanvas');
    const r = zone.ratio || 4 / 3;
    const W = stage.clientWidth - 20, H = stage.clientHeight - 20;
    let w = W, h = W / r;
    if (h > H) { h = H; w = H * r; }
    c.style.width = Math.max(120, Math.floor(w)) + 'px';
    c.style.height = Math.max(90, Math.floor(h)) + 'px';
    layoutHotspots();
  }
  function renderScene() {
    const zone = DATA.zones[state.zone];
    const canvas = $('#sceneCanvas');
    canvas.classList.toggle('edit-mode', state.edit);
    canvas.style.backgroundImage = zone.bg ? `url("${zone.bg}")` : '';
    $('#zoneLabel').textContent = zone.title;
    const cont = $('#hotspotsContainer'); cont.innerHTML = '<svg class="hs-lines" id="hsLines"></svg>';
    DATA.hotspots.filter((h) => h.zone === state.zone).forEach((h) => {
      const dot = document.createElement('div'); dot.className = 'hs-dot';
      const b = document.createElement('button');
      b.type = 'button';
      const seen = state.viewed.has(h.target);
      b.className = 'hotspot' + (seen ? ' visited' : '');
      b.innerHTML = `<span>${seen ? '✔' : '🔍'}</span><span>${esc(h.label)}</span>`;
      b._h = h; b._dot = dot;
      attachHotspot(b, h, canvas);
      cont.appendChild(dot); cont.appendChild(b);
    });
    document.querySelectorAll('.tab-btn').forEach((t) => t.classList.toggle('active', t.dataset.zone === state.zone));
    fitCanvas(); updateProgress();
  }

  // 말풍선 자동 배치: (x,y)는 단서 위치. 겹치지 않으면 그 자리에, 겹치면 가까운 빈자리로 옮기고 연결선을 그린다.
  function layoutHotspots(priorityId) {
    const canvas = $('#sceneCanvas'); const cont = $('#hotspotsContainer');
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (!W || !H) return;
    canvas.style.setProperty('--hs-fs', Math.max(10.5, Math.min(13, W / 30)).toFixed(1) + 'px');
    const els = [...cont.querySelectorAll('.hotspot')];
    const items = els.map((el) => ({ el, h: el._h, w: el.offsetWidth, hh: el.offsetHeight, ax: (el._h.x / 100) * W, ay: (el._h.y / 100) * H }));
    // 위쪽 단서부터, 드래그 중인 말풍선은 맨 먼저 자리를 차지
    items.sort((a, b) => (b.h.id === priorityId) - (a.h.id === priorityId) || a.ay - b.ay || a.ax - b.ax);
    const PAD = 4, GAP = 5, placed = [];
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const overlap = (r) => placed.reduce((s, q) => {
      const ox = Math.min(r.x + r.w + GAP, q.x + q.w) - Math.max(r.x - GAP, q.x);
      const oy = Math.min(r.y + r.h + GAP, q.y + q.h) - Math.max(r.y - GAP, q.y);
      return s + (ox > 0 && oy > 0 ? ox * oy : 0);
    }, 0);
    let svg = '';
    items.forEach((it) => {
      const { w, hh: h, ax, ay } = it;
      const dy = h + 10, dx = w / 2 + 14;
      const cands = [[0, 0], [0, -dy], [0, dy], [-dx, 0], [dx, 0], [-dx, -dy], [dx, -dy], [-dx, dy], [dx, dy], [0, -2 * dy], [0, 2 * dy], [-2 * dx, 0], [2 * dx, 0]];
      let best = null;
      for (const [ox, oy] of cands) {
        const r = { x: clamp(ax + ox - w / 2, PAD, W - w - PAD), y: clamp(ay + oy - h / 2, PAD, H - h - PAD), w, h };
        const cost = overlap(r) * 1000 + Math.hypot(r.x + w / 2 - ax, r.y + h / 2 - ay);
        if (!best || cost < best.cost) best = { r, cost };
        if (overlap(r) === 0 && ox === 0 && oy === 0) break;
      }
      const r = best.r; placed.push(r);
      it.el.style.transform = `translate(${Math.round(r.x)}px, ${Math.round(r.y)}px)`;
      // 단서 지점이 말풍선 밖으로 벗어났으면 점 + 연결선 표시
      const inside = ax >= r.x && ax <= r.x + w && ay >= r.y && ay <= r.y + h;
      it.el.classList.toggle('moved', !inside);
      const dot = it.el._dot; dot.classList.toggle('show', !inside);
      dot.style.left = ax + 'px'; dot.style.top = ay + 'px';
      if (!inside) {
        const ex = clamp(ax, r.x + 10, r.x + w - 10), ey = clamp(ay, r.y, r.y + h);
        svg += `<line x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}"/>`;
      }
    });
    const lines = $('#hsLines'); if (lines) lines.innerHTML = svg;
  }
  function attachHotspot(el, h, canvas) {
    let down = false, moved = false, sx = 0, sy = 0;
    el.addEventListener('pointerdown', (e) => {
      down = true; moved = false; sx = e.clientX; sy = e.clientY;
      if (state.edit) el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => {
      if (!down || !state.edit) return;
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < 5) return;
      moved = true; el.classList.add('dragging');
      const r = canvas.getBoundingClientRect();
      h.x = Math.round(Math.max(2, Math.min(98, ((e.clientX - r.left) / r.width) * 100)) * 10) / 10;
      h.y = Math.round(Math.max(2, Math.min(98, ((e.clientY - r.top) / r.height) * 100)) * 10) / 10;
      layoutHotspots(h.id);
    });
    el.addEventListener('pointerup', () => {
      if (!down) return; down = false; el.classList.remove('dragging');
      if (moved) { save(); layoutHotspots(); return; }
      openNode(h.target, { hotspotId: h.id, fresh: true });
    });
    el.addEventListener('pointercancel', () => { down = false; el.classList.remove('dragging'); });
  }
  function updateProgress() {
    const total = Object.keys(DATA.nodes).length;
    const seen = [...state.viewed].filter((id) => DATA.nodes[id]).length;
    $('#progressText').textContent = `단서 ${seen} / ${total}`;
  }

  // ---------- modal ----------
  function openNode(id, opts = {}) {
    if (!DATA.nodes[id]) { toast('연결된 힌트 카드가 없습니다. 세팅에서 연결 카드를 지정하세요.'); return; }
    if (opts.fresh) state.stack = [];
    else if (state.current && opts.push) state.stack.push({ id: state.current, hotspotId: state.hotspotId });
    state.current = id;
    state.hotspotId = opts.hotspotId || null;
    state.viewed.add(id);
    state.delArm = null;
    $('#clueModal').classList.add('open');
    renderModal();
    renderAdmin();
    $('.modal-scroll').scrollTop = 0;
    renderScene();
  }
  function closeModal() {
    $('#clueModal').classList.remove('open');
    state.current = null; state.stack = []; state.hotspotId = null;
  }
  function goBack() {
    const prev = state.stack.pop();
    if (!prev) { closeModal(); return; }
    state.current = prev.id; state.hotspotId = prev.hotspotId; state.delArm = null;
    renderModal(); renderAdmin(); $('.modal-scroll').scrollTop = 0;
  }
  function navButtons(ids, cls, prefix) {
    return ids.filter((id) => DATA.nodes[id]).map((id) =>
      `<button type="button" class="${cls}${state.viewed.has(id) ? ' seen' : ''}" data-go="${esc(id)}">${prefix}${esc(DATA.nodes[id].title)}</button>`
    ).join('');
  }
  function renderModal() {
    const n = DATA.nodes[state.current]; if (!n) return;
    $('#modalTitle').textContent = '📌 ' + n.title;
    $('#backBtn').style.visibility = state.stack.length ? 'visible' : 'hidden';
    const choices = (n.choices || []).filter((id) => DATA.nodes[id]);
    const links = (n.links || []).filter((id) => DATA.nodes[id]);
    const revealed = state.revealed.has(state.current);
    let html = '';
    if (n.img) html += `<div class="clue-image-box"><img src="${n.img}" alt="${esc(n.title)} 증거 슬라이드" /></div>`;
    else if (state.edit) html += `<div class="clue-image-box"><div class="clue-image-empty">🗂️ 이 카드에 넣을 증거 슬라이드 이미지가 없습니다.<br/>아래 세팅 패널에서 이미지를 올릴 수 있습니다.</div></div>`;
    if (!n.basic && !n.bonus && !choices.length && !links.length && !n.img) html += `<div class="clue-image-box"><div class="clue-image-empty">이 단서에는 아직 힌트가 없습니다.${state.edit ? '<br/>아래에서 기본 힌트와 보너스 힌트를 입력하세요.' : ''}</div></div>`;
    if (n.basic) html += `<div class="hint-card"><div class="hint-label">기본 힌트</div><div class="hint-text">${esc(n.basic)}</div></div>`;
    if (choices.length) html += `<div class="choice-grid">${navButtons(choices, 'choice-btn', '🔎 ')}</div>`;
    if (n.bonus || links.length) {
      if (revealed) {
        html += `<div class="hint-card reveal"><div class="hint-label">보너스 힌트</div>${n.bonus ? `<div class="hint-text">${esc(n.bonus)}</div>` : ''}` +
          (links.length ? `<div class="links-wrap">${navButtons(links, 'link-btn', '🔗 ')}</div>` : '') + `</div>`;
      } else {
        html += `<button type="button" class="bonus-cover" id="revealBtn">👆 터치해서 보너스 힌트 보기<small>막히면 열어 보세요</small></button>`;
      }
    }
    html += `<button type="button" class="back-scene" id="toSceneBtn">🚨 사건 현장으로 돌아가기</button>`;
    const body = $('#modalBody'); body.innerHTML = html;
    body.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => openNode(b.dataset.go, { push: true })));
    const rb = $('#revealBtn'); if (rb) rb.addEventListener('click', () => { state.revealed.add(state.current); renderModal(); });
    $('#toSceneBtn').addEventListener('click', closeModal);
  }

  // ---------- admin ----------
  function checkList(field, n) {
    const others = Object.entries(DATA.nodes).filter(([id]) => id !== state.current);
    return `<div class="check-list">` + others.map(([id, o]) =>
      `<label><input type="checkbox" data-field="${field}" value="${esc(id)}" ${(n[field] || []).includes(id) ? 'checked' : ''}/> ${esc(o.title)}</label>`
    ).join('') + `</div>`;
  }
  function renderAdmin() {
    const p = $('#adminPanel');
    p.classList.toggle('show', state.edit);
    if (!state.edit || !state.current) { p.innerHTML = ''; return; }
    const n = DATA.nodes[state.current];
    const h = state.hotspotId ? DATA.hotspots.find((x) => x.id === state.hotspotId) : null;
    const opts = Object.entries(DATA.nodes).map(([id, o]) => `<option value="${esc(id)}" ${h && h.target === id ? 'selected' : ''}>${esc(o.title)}</option>`).join('');
    p.innerHTML = `
      <h3>✏️ 힌트 카드 편집</h3>
      <label class="f">카드 제목<input type="text" id="edTitle" value="${esc(n.title)}" /></label>
      <div class="admin-row">
        <label class="tool-btn blue">📁 증거 슬라이드 이미지 올리기<input type="file" accept="image/*" hidden id="edImg" /></label>
        ${n.img ? '<button type="button" class="tool-btn red" id="edImgDel">이미지 삭제</button>' : ''}
      </div>
      <label class="f">기본 힌트 (항상 보임)<textarea id="edBasic">${esc(n.basic)}</textarea></label>
      <label class="f">보너스 힌트 (터치해야 보임)<textarea id="edBonus">${esc(n.bonus)}</textarea></label>
      <details ${(n.links || []).length ? 'open' : ''}><summary>🔗 보너스 힌트를 연 뒤 이어지는 카드 (${(n.links || []).length})</summary>${checkList('links', n)}</details>
      <details ${(n.choices || []).length ? 'open' : ''}><summary>🔎 기본 힌트 아래 바로 보이는 선택지 (${(n.choices || []).length})</summary>
        <p class="admin-note" style="margin-top:6px">노트북처럼 여러 화면 중 하나를 고르게 할 때 씁니다.</p>${checkList('choices', n)}</details>
      <div class="admin-row">
        <button type="button" class="tool-btn gray" id="edNewLink">＋ 새 카드 만들어 보너스에 연결</button>
        <button type="button" class="tool-btn gray" id="edNewChoice">＋ 새 카드 만들어 선택지로 추가</button>
      </div>
      ${h ? `<div class="divider"></div><h3>💬 이 말풍선</h3>
      <label class="f">말풍선 이름<input type="text" id="edHsLabel" value="${esc(h.label)}" /></label>
      <label class="f">눌렀을 때 여는 카드<select id="edHsTarget">${opts}</select></label>
      <div class="admin-row"><button type="button" class="tool-btn red" id="edHsDel">${state.delArm === 'hs' ? '한 번 더 누르면 말풍선 삭제' : '말풍선 삭제'}</button></div>` : ''}
      <div class="divider"></div>
      <div class="admin-row"><button type="button" class="tool-btn red" id="edNodeDel">${state.delArm === 'node' ? '한 번 더 누르면 이 카드 삭제' : '이 카드 삭제'}</button></div>
      <p class="admin-note">편집 내용은 이 브라우저에 임시 저장됩니다. 다른 기기에서 쓰려면 상단의 [완성본 HTML 저장]으로 파일을 새로 받으세요.</p>`;

    const bindText = (sel, key, after) => $(sel).addEventListener('input', (e) => { n[key] = e.target.value; save(); after && after(); });
    bindText('#edTitle', 'title', () => { $('#modalTitle').textContent = '📌 ' + n.title; });
    bindText('#edBasic', 'basic', renderModal);
    bindText('#edBonus', 'bonus', renderModal);
    $('#edImg').addEventListener('change', (e) => loadImage(e.target.files[0], 1400, (url) => { n.img = url; save(); renderModal(); renderAdmin(); }));
    const del = $('#edImgDel'); if (del) del.addEventListener('click', () => { n.img = ''; save(); renderModal(); renderAdmin(); });
    p.querySelectorAll('input[type=checkbox][data-field]').forEach((cb) => cb.addEventListener('change', () => {
      const f = cb.dataset.field; const arr = n[f] = n[f] || [];
      if (cb.checked) { if (!arr.includes(cb.value)) arr.push(cb.value); } else n[f] = arr.filter((x) => x !== cb.value);
      save(); renderModal(); renderAdmin();
    }));
    const mk = (field) => () => {
      const id = uid('card'); DATA.nodes[id] = { title: '새 힌트 카드', basic: '', bonus: '', img: '', choices: [], links: [] };
      (n[field] = n[field] || []).push(id); save(); renderModal(); renderAdmin(); updateProgress();
      toast('새 카드를 만들었습니다. 연결 버튼을 눌러 내용을 편집하세요.');
    };
    $('#edNewLink').addEventListener('click', mk('links'));
    $('#edNewChoice').addEventListener('click', mk('choices'));
    if (h) {
      $('#edHsLabel').addEventListener('input', (e) => { h.label = e.target.value; save(); renderScene(); });
      $('#edHsTarget').addEventListener('change', (e) => { h.target = e.target.value; save(); openNode(h.target, { hotspotId: h.id, fresh: true }); });
      $('#edHsDel').addEventListener('click', () => {
        if (state.delArm !== 'hs') { state.delArm = 'hs'; renderAdmin(); return; }
        DATA.hotspots = DATA.hotspots.filter((x) => x.id !== h.id); save(); closeModal(); renderScene();
      });
    }
    $('#edNodeDel').addEventListener('click', () => {
      if (state.delArm !== 'node') { state.delArm = 'node'; renderAdmin(); return; }
      const id = state.current; delete DATA.nodes[id];
      Object.values(DATA.nodes).forEach((o) => { o.links = (o.links || []).filter((x) => x !== id); o.choices = (o.choices || []).filter((x) => x !== id); });
      DATA.hotspots = DATA.hotspots.filter((x) => x.target !== id);
      save(); closeModal(); renderScene();
    });
  }
  function loadImage(file, max, cb) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.85), img.width / img.height);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }

  // ---------- toolbar ----------
  function toggleEdit() {
    state.edit = !state.edit;
    $('#editModeBtn').classList.toggle('active', state.edit);
    $('#editToolbar').classList.toggle('show', state.edit);
    renderScene(); renderAdmin(); if (state.current) renderModal();
    requestAnimationFrame(fitCanvas);
  }
  $('#editModeBtn').addEventListener('click', toggleEdit);
  $('#bgInput').addEventListener('change', (e) => loadImage(e.target.files[0], 1400, (url, ratio) => {
    const z = DATA.zones[state.zone]; z.bg = url; z.ratio = ratio; save(); renderScene(); e.target.value = '';
  }));
  $('#addHotspotBtn').addEventListener('click', () => {
    const nid = uid('card'); DATA.nodes[nid] = { title: '새 힌트 카드', basic: '', bonus: '', img: '', choices: [], links: [] };
    const h = { id: uid('hs'), zone: state.zone, label: '새 단서', x: 50, y: 50, target: nid };
    DATA.hotspots.push(h); save(); renderScene(); openNode(nid, { hotspotId: h.id, fresh: true });
  });
  $('#importInput').addEventListener('change', (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const doc = new DOMParser().parseFromString(r.result, 'text/html');
        const s = doc.getElementById('game-data');
        if (!s) throw new Error('no data');
        const d = JSON.parse(s.textContent);
        if (!d.nodes || !d.hotspots || !d.zones) throw new Error('bad data');
        DATA.zones = d.zones; DATA.hotspots = d.hotspots; DATA.nodes = d.nodes;
        save(); closeModal(); renderScene();
        toast('기존 파일의 힌트·말풍선 위치·배경을 불러왔습니다. [완성본 HTML 저장]으로 새 파일을 받으세요.');
      } catch (err) { toast('이 파일에서 힌트 데이터를 찾지 못했습니다. 이 도구로 저장한 완성본 HTML인지 확인하세요.'); }
    };
    r.readAsText(f);
  });
  $('#resetProgressBtn').addEventListener('click', () => { state.viewed.clear(); state.revealed.clear(); renderScene(); toast('확인한 단서와 열린 보너스 힌트를 초기화했습니다.'); });
  $('#exportBtn').addEventListener('click', () => {
    const copy = JSON.parse(JSON.stringify(DATA)); copy.updatedAt = Date.now();
    const clone = document.documentElement.cloneNode(true);
    clone.querySelector('#game-data').textContent = JSON.stringify(copy).replace(/</g, '\\u003c');
    clone.querySelector('#clueModal').classList.remove('open');
    clone.querySelector('#editToolbar').classList.remove('show');
    clone.querySelector('#editModeBtn').classList.remove('active');
    clone.querySelector('#hotspotsContainer').innerHTML = '';
    clone.querySelector('#modalBody').innerHTML = '';
    clone.querySelector('#adminPanel').innerHTML = '';
    const blob = new Blob(['<!DOCTYPE html>\n' + clone.outerHTML], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '크라임씬_모바일_추리게임_완성본.html';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    toast('완성본 HTML을 저장했습니다. 이 파일을 참가자에게 배포하세요.');
  });
  document.querySelectorAll('.tab-btn').forEach((t) => t.addEventListener('click', () => { state.zone = t.dataset.zone; renderScene(); }));
  $('#closeBtn').addEventListener('click', closeModal);
  $('#backBtn').addEventListener('click', goBack);
  $('#clueModal').addEventListener('click', (e) => { if (e.target.id === 'clueModal') closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.current) closeModal(); });
  window.addEventListener('resize', fitCanvas);
  renderScene();
})();
</script>


</body></html>
